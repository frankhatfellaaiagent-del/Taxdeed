<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax Deed Scrub — Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);
    --series-1:  #2a78d6;
    --good:      #0ca30c;
    --good-text: #006300;
    --warning:   #fab219;
    --critical:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --series-1:  #3987e5;
      --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; font-weight: 650; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.running { color: var(--series-1); }
  .badge.idle { color: var(--muted); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; font-weight: 650; margin: 0 0 12px; color: var(--ink-2);
             text-transform: uppercase; letter-spacing: 0.04em; }
  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .tile .v { font-size: 26px; font-weight: 650; }
  .tile .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .tile .d { font-size: 12px; margin-top: 2px; }
  .d.up { color: var(--good-text); }
  /* progress */
  .track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: var(--series-1); border-radius: 5px; transition: width .6s ease; }
  .progress-meta { display: flex; justify-content: space-between; color: var(--ink-2);
                   font-size: 13px; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  /* live feed */
  .feed { list-style: none; margin: 12px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
  .feed li { display: flex; gap: 8px; align-items: baseline; padding: 5px 2px;
             border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .feed li:last-child { border-bottom: 0; }
  .st { font-size: 12px; font-weight: 600; min-width: 76px; }
  .st.ok { color: var(--good-text); } .st.err { color: var(--critical); } .st.warn { color: var(--ink-2); }
  .st.cur { color: var(--series-1); }
  .feed .slug { min-width: 110px; font-weight: 600; }
  .feed .note { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes pulse { 50% { opacity: .35; } }
  .cur-dot { animation: pulse 1.4s ease-in-out infinite; }
  /* bar chart (auctions by county) */
  .bars { display: grid; grid-template-columns: 110px 1fr 46px; gap: 6px 10px; align-items: center; }
  .bars .name { font-size: 13px; color: var(--ink-2); text-align: right; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .bar-cell { position: relative; height: 16px; border-left: 1px solid var(--baseline); }
  .bar { position: absolute; inset: 1px auto 1px 0; background: var(--series-1);
         border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-cell:hover .bar { filter: brightness(1.12); }
  .bars .val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }
  /* tables */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
       padding: 6px 8px; border-bottom: 1px solid var(--baseline); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); font-size: 13px; }
  td.num, th.num { text-align: right; }
  a { color: var(--series-1); }
  .empty { color: var(--muted); padding: 8px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .match-chip { display: inline-block; font-size: 12px; font-weight: 600; color: var(--good-text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Florida Tax Deed Scrub</h1>
    <span id="status-badge" class="badge idle">idle</span>
    <span class="sub" id="updated"></span>
  </header>

  <div class="card" id="live-card" hidden>
    <h2>Run in progress</h2>
    <div class="track"><div class="fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-meta">
      <span id="prog-label"></span>
      <span id="prog-counts"></span>
    </div>
    <ul class="feed" id="feed"></ul>
  </div>

  <div class="card">
    <h2>Latest results <span id="latest-name" style="text-transform:none;font-weight:400"></span></h2>
    <div class="tiles" id="tiles"><div class="empty">No finished runs yet — start one with
      <code>python -m scraper run</code>.</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Auctions by county</h2>
      <div class="bars" id="bars"><div class="empty">—</div></div>
    </div>
    <div class="card">
      <h2>County status</h2>
      <div style="max-height:300px;overflow-y:auto">
      <table id="county-table">
        <thead><tr><th>County</th><th>Status</th><th class="num">Auctions</th><th class="num">Matches</th><th>Notes</th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Run history</h2>
    <table id="runs-table">
      <thead><tr><th>Run</th><th class="num">Counties</th><th class="num">Records</th>
        <th class="num">New</th><th class="num">Changed</th><th class="num">Removed</th>
        <th class="num">Buy-box</th><th>Report</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = iso => iso ? new Date(iso).toLocaleString() : "";

function statusLabel(c) {
  if (c.status === "ok") return '<span class="st ok">&#10003; ok</span>';
  if (c.status === "error") return '<span class="st err">&#10007; error</span>';
  if (c.status === "skipped_robots") return '<span class="st warn">&#9888; robots</span>';
  return '<span class="st warn">' + esc(c.status || "…") + '</span>';
}

function renderLive(cur) {
  const card = $("live-card");
  if (!cur) { card.hidden = true; return; }
  card.hidden = false;
  const done = Object.keys(cur.counties || {}).length;
  const total = cur.total_counties || 0;
  $("prog-fill").style.width = total ? (100 * done / total).toFixed(1) + "%" : "0%";
  $("prog-label").textContent = cur.current_county
    ? "scraping " + cur.current_county + "…" : "finishing…";
  const recs = Object.values(cur.counties || {}).reduce((a, c) => a + (c.auctions || 0), 0);
  $("prog-counts").textContent = done + " / " + total + " counties · " + recs + " records";
  const rows = Object.entries(cur.counties || {}).map(([slug, c]) =>
    '<li>' + statusLabel(c) + '<span class="slug">' + esc(slug) + '</span>' +
    '<span>' + (c.auctions ?? 0) + ' rec</span>' +
    '<span class="note">' + esc(c.error || (c.warnings || []).join("; ")) + '</span></li>');
  if (cur.current_county)
    rows.push('<li><span class="st cur cur-dot">&#9679; now</span><span class="slug">' +
      esc(cur.current_county) + '</span><span class="note">in progress…</span></li>');
  $("feed").innerHTML = rows.reverse().join("");
}

function renderLatest(latest) {
  if (!latest) return;
  $("latest-name").textContent = "— " + latest.name + (latest.live === false ? " (fixture demo)" : "");
  const f = latest.findings || {};
  const tiles = [
    ["Auctions", latest.records],
    ["New", f.new],
    ["Changed", f.changed],
    ["Removed", f.removed],
    ["Buy-box match", f.buybox_match],
    ["Review", f.buybox_review],
    ["County errors", latest.counties_error],
  ];
  $("tiles").innerHTML = tiles.map(([l, v]) =>
    '<div class="tile"><div class="v">' + (v ?? "–") + '</div><div class="l">' + l + '</div></div>').join("");

  const detail = Object.entries(latest.county_detail || {});
  const withN = detail.map(([slug, c]) => [slug, c, c.auctions || 0])
                      .sort((a, b) => b[2] - a[2]);
  const max = Math.max(1, ...withN.map(x => x[2]));
  const top = withN.slice(0, 15);
  $("bars").innerHTML = top.length ? top.map(([slug, c, n]) =>
    '<div class="name">' + esc(slug) + '</div>' +
    '<div class="bar-cell" title="' + esc(slug) + ': ' + n + ' auctions"><div class="bar" style="width:' +
      (100 * n / max).toFixed(1) + '%"></div></div>' +
    '<div class="val">' + n + '</div>').join("")
    : '<div class="empty">—</div>';

  const byCounty = (latest.findings || {}).by_county || {};
  $("county-table").querySelector("tbody").innerHTML = detail.map(([slug, c]) =>
    '<tr><td>' + esc(slug) + '</td><td>' + statusLabel(c) + '</td>' +
    '<td class="num">' + (c.auctions ?? 0) + '</td>' +
    '<td class="num">' + ((byCounty[slug] || {}).match ?? "") + '</td>' +
    '<td class="note" style="color:var(--muted)">' +
      esc(c.error || (c.warnings || []).slice(0, 2).join("; ")) + '</td></tr>').join("");
}

function renderRuns(runs) {
  $("runs-table").querySelector("tbody").innerHTML = (runs || []).map(r => {
    const f = r.findings || {};
    return '<tr><td>' + esc(r.name) + '<br><span style="color:var(--muted);font-size:12px">' +
      esc(fmtTime(r.started_at)) + '</span></td>' +
      '<td class="num">' + r.counties_ok + '/' + r.counties_total +
        (r.counties_error ? ' <span class="st err">(' + r.counties_error + ' err)</span>' : '') + '</td>' +
      '<td class="num">' + r.records + '</td>' +
      '<td class="num">' + (f.new ?? "–") + '</td>' +
      '<td class="num">' + (f.changed ?? "–") + '</td>' +
      '<td class="num">' + (f.removed ?? "–") + '</td>' +
      '<td class="num">' + (f.buybox_match != null ?
          '<span class="match-chip">' + f.buybox_match + '</span>' : "–") + '</td>' +
      '<td>' + (r.has_report ? '<a href="' + esc(r.report_href) + '">xlsx</a>' : "–") + '</td></tr>';
  }).join("") || '<tr><td colspan="8" class="empty">No runs yet.</td></tr>';
}

async function tick() {
  try {
    const res = await fetch("/api/state");
    const state = await res.json();
    const badge = $("status-badge");
    if (state.current) { badge.textContent = "run in progress"; badge.className = "badge running"; }
    else { badge.textContent = "idle"; badge.className = "badge idle"; }
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
    renderLive(state.current);
    renderLatest(state.latest);
    renderRuns(state.runs);
  } catch (e) {
    $("status-badge").textContent = "server unreachable";
    $("status-badge").className = "badge idle";
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
