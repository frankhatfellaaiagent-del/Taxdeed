name: On-demand enrichment

# Widens verification coverage on demand: appraiser records, clerk case files
# and case paperwork for buy-box parcels the store hasn't seen (or whose
# entries have gone stale). The data refresh (scrape.yml) now runs DAILY and
# includes its own enrichment pass, so this workflow no longer needs a
# schedule of its own — it's here for manual deeper passes (e.g. a bigger
# --limit after adding a new county). Best-effort by design — a county portal
# misbehaving costs coverage, never the feed.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max parcels to enrich this run"
        default: "400"
        required: false
      backfill_geometry:
        description: "Only top up parcel boundaries on already-enriched entries (cheap ReportAll-only pass)"
        type: boolean
        default: false
      landcheck:
        description: "Only run the GIS land check (wetlands/flood/access) per parcel — free public GIS, no key"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data-pipeline   # never race the daily refresh
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Enrich + rebuild feed
        run: |
          if [ "${{ github.event.inputs.backfill_geometry }}" = "true" ]; then
            python -m scraper -v enrich --backfill-geometry --limit "${{ github.event.inputs.limit || '400' }}" || true
          elif [ "${{ github.event.inputs.landcheck }}" = "true" ]; then
            python -m scraper -v enrich --landcheck --limit "${{ github.event.inputs.limit || '400' }}" || true
          else
            python -m scraper -v enrich --limit "${{ github.event.inputs.limit || '400' }}" --debug-dir output/debug/enrich || true
          fi
          latest=$(ls -d data/runs/*/ 2>/dev/null | sort | tail -1 || true)
          [ -z "$latest" ] && { echo "no run directory to export from"; exit 0; }
          python -m scraper export --run "$latest"
        env:
          REPORTALL_API_KEY: ${{ secrets.REPORTALL_API_KEY }}

      - name: Coverage report
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("data/exports/master_list.json"))
          recs = d["records"]
          n = len(recs)
          def pct(k): return f"{sum(1 for r in recs if r.get(k))}/{n}"
          print(f"enriched: {pct('enriched')}  property_use: {pct('property_use')}  "
                f"owner: {pct('owner_name')}  case files: {pct('clerk_case_url')}  "
                f"case docs: {pct('case_docs')}  coords: {pct('lat')}  "
                f"parcel boundaries: {pct('parcel_geometry')}")
          e = json.load(open("data/enrichment.json"))
          print(f"store: {len(e)} entries, {sum(1 for v in e.values() if v.get('ok'))} ok")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/exports
          git add -f data/enrichment.json data/geocache.json 2>/dev/null || true
          git commit -m "On-demand enrichment: deeper verification coverage" || { echo "nothing new"; exit 0; }
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) — rebasing onto the latest tip"
            git fetch origin "${{ github.ref_name }}" || true
            # --autostash: an unstaged leftover must never wedge the rebase.
            if ! git rebase --autostash -X theirs "origin/${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 10))
          done
          [ "$pushed" = 1 ] || { echo "::error::push failed after retries"; exit 1; }
          gh workflow run pages.yml --ref "${{ github.ref_name }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-debug
          path: output/debug/
          if-no-files-found: ignore
          retention-days: 14
