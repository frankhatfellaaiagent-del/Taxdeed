name: Daily data refresh

# The production data pipeline: collect every county's upcoming tax deed
# auctions, verify against county records (enrichment), and refresh the
# committed feeds. Scheduled daily so status changes (a parcel getting
# redeemed, a sale cancelled) reach the board within a day instead of
# sitting stale for a week. The heavy, low-churn steps — live county
# discovery and evidence capture — run only on Mondays; manual dispatch is
# always a full run. Pushes touching the scraper run a 1-county smoke test
# (no commit). Pure Python end to end: a run costs Actions minutes only.

on:
  workflow_dispatch:
    inputs:
      counties:
        description: "Comma-separated county slugs, or @config/client_counties.txt for all"
        default: "@config/client_counties.txt"
        required: false
  schedule:
    # Daily 08:00 UTC (4:00 AM ET) — yesterday's redemptions and status
    # changes are on the board before the workday starts.
    - cron: "0 8 * * *"
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  actions: write  # to dispatch the Pages deploy after committing new data

concurrency:
  # Real data runs (manual + scheduled) serialize with the nightly enrichment on
  # "data-pipeline", since they both commit to the same files. The push-triggered
  # smoke test commits nothing, so it gets its own lane — sharing the group let a
  # routine merge cancel a queued refresh, which is exactly what happened once.
  group: ${{ github.event_name == 'push' && 'scrape-smoke' || 'data-pipeline' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Offline regression (fixtures)
        run: |
          python -m scraper discover --fixtures scraper/fixtures
          python -m scraper run --counties volusia,polk --fixtures scraper/fixtures --skip-robots --out output/fixture-regression

      - name: Decide run scope
        id: scope
        # Scheduled runs are daily, but the county list changes rarely and
        # evidence capture is the slowest, bulkiest step — scheduled runs do
        # those only on Mondays. Manual dispatch and push smoke tests keep
        # their full behavior.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "Light daily run: skipping live discovery and capture."
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Full run: live discovery and capture included."
          fi

      - name: Live county discovery
        id: discover
        if: steps.scope.outputs.heavy == 'true'
        continue-on-error: true
        run: python -m scraper -v discover

      - name: Live scrape
        id: scrape
        continue-on-error: true
        run: |
          # Pushes get a quick 1-county smoke test; manual/scheduled runs
          # default to the full county list.
          python -m scraper -v run --counties "${{ github.event_name == 'push' && 'volusia' || github.event.inputs.counties || '@config/client_counties.txt' }}"

      - name: Scrape non-RealAuction counties (Bid4Assets + clerk lists)
        id: clerk
        # The 45 RealAuction counties come from the step above; these are the
        # counties on other platforms (Okaloosa on Bid4Assets, in-person clerk
        # lists). They write <slug>.json into the same run dir, so the export's
        # carry-forward merges them into the feed beside the RealAuction rows.
        # Skipped on push smoke tests (single-county, no commit).
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          latest=$(ls -td output/runs/*/ 2>/dev/null | head -1 || true)
          if [ -z "$latest" ]; then echo "no run dir; skipping clerk scrape"; exit 0; fi
          python -m scraper -v scrape-clerk --out "$latest"

      - name: Capture live pages (debug diagnostics)
        if: always() && steps.scope.outputs.heavy == 'true'
        continue-on-error: true
        run: python -m scraper capture --out output/debug

      - name: Show results in log
        if: always()
        run: |
          echo "discover outcome: ${{ steps.discover.outcome }}"
          echo "scrape outcome:   ${{ steps.scrape.outcome }}"
          echo "=================== config/counties.json (first 60 lines)"
          head -60 config/counties.json || true
          latest=$(ls -td output/runs/*/ 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            echo "=================== $latest/run_meta.json"
            cat "$latest/run_meta.json" || true
            echo "=================== $latest/findings.json"
            cat "$latest/findings.json" || true
            for f in "$latest"*.csv; do
              echo "=================== $f (first 5 rows)"
              head -6 "$f" || true
            done
          else
            echo "No live run directory produced."
          fi

      - name: Commit run data to branch (manual + scheduled runs)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          latest=$(ls -td output/runs/*/ 2>/dev/null | head -1 || true)
          [ -z "$latest" ] && { echo "no run to commit"; exit 0; }
          name=$(basename "$latest")
          mkdir -p data/runs
          cp -r "$latest" "data/runs/$name"
          cp config/counties.json "data/runs/$name/counties.json" || true
          # Refresh the fixed-URL feeds consumed by the Google Sheet and the
          # dashboard (docs/DATA_FEED.md documents the contract). First export
          # builds the feed (geocoding new addresses), then the appraiser
          # quick-look enrichment runs against it, then a re-export merges the
          # enrichment in. Enrichment is best-effort — a broken county parser
          # never blocks the feed.
          python -m scraper export --run "data/runs/$name" || true
          # Quick-look scrub: appraiser record, the parcel's clerk case file, the
          # paperwork inside it, and (only when REPORTALL_API_KEY is configured)
          # the ReportAll parcel record.
          python -m scraper -v enrich --limit 300 --debug-dir output/debug/enrich || true
          # Note: the land check (wetlands / flood / access) is NOT run daily —
          # it's on-demand from the property card (a per-parcel button, computed
          # client-side from free public GIS), so nothing extra is pulled every
          # day. `enrich --landcheck` stays available for an optional bulk pass.
          python -m scraper export --run "data/runs/$name" || true
          # Retention: the feeds carry the merged history; keep only the last
          # 10 raw run directories (~1.5 weeks at daily cadence) so the repo
          # doesn't grow forever. Light daily runs skip capture, so most of
          # these directories are small.
          keep=10
          prune=$(ls -d data/runs/*/ 2>/dev/null | sort | head -n -$keep || true)
          [ -n "$prune" ] && git rm -rq $prune || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/runs data/exports
          git add -f data/geocache.json data/enrichment.json 2>/dev/null || true
          # The discovery step rewrites this tracked file. Stage it with the run
          # (it IS part of the refresh) — and leaving it unstaged used to wedge
          # the rebase below with "cannot rebase: You have unstaged changes".
          git add -f config/counties.json 2>/dev/null || true
          git commit -m "Data refresh: $name (${{ github.event.inputs.counties || 'daily auto' }})" || exit 0
          # Anything pushed to the branch while the scrape was running (another
          # run, or a person) rejects this push. Rebase onto the new tip and try
          # again rather than losing an hour of scraping. On a conflict in the
          # generated feeds, -X theirs keeps THIS run's data: during a rebase
          # "theirs" is the commit being replayed, i.e. ours, and the fresher
          # scrape is the one worth keeping.
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) — rebasing onto the latest tip"
            git fetch origin "${{ github.ref_name }}" || true
            # --autostash so a stray unstaged file (debug output, a regenerated
            # config) can never stop the rebase and strand an hour of scraping.
            if ! git rebase --autostash -X theirs "origin/${{ github.ref_name }}"; then
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 10))
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push run data after 8 attempts"
            exit 1
          fi
          # Token-authored pushes don't fire push-triggered workflows, so
          # explicitly redeploy the hosted dashboard with the fresh feeds.
          gh workflow run pages.yml --ref "${{ github.ref_name }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: add this repository secret to switch on ReportAll parcel
          # lookups (the LandGlide data). Unset = the step is skipped silently.
          REPORTALL_API_KEY: ${{ secrets.REPORTALL_API_KEY }}

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-run-outputs
          path: |
            output/runs/
            output/debug/
            data/enrichment.json
            config/counties.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if live steps failed
        # On light daily runs discovery is skipped, so a scrape failure alone
        # must fail the job — there's no other live signal that day.
        if: >-
          steps.scrape.outcome == 'failure' &&
          (steps.discover.outcome == 'failure' || steps.discover.outcome == 'skipped')
        run: exit 1
