name: Weekly data refresh

# The production data pipeline: collect every county's upcoming tax deed
# auctions, verify against county records (enrichment), and refresh the
# committed feeds. Scheduled weekly; manual dispatch for on-demand refreshes;
# pushes touching the scraper run a 1-county smoke test (no commit).

on:
  workflow_dispatch:
    inputs:
      counties:
        description: "Comma-separated county slugs, or @config/client_counties.txt for all"
        default: "@config/client_counties.txt"
        required: false
  schedule:
    # Mondays 08:00 UTC (4:00 AM ET) — fresh data waiting before the workday.
    - cron: "0 8 * * 1"
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  actions: write  # to dispatch the Pages deploy after committing new data

concurrency:
  group: data-pipeline   # shared with the daily enrichment workflow
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Offline regression (fixtures)
        run: |
          python -m scraper discover --fixtures scraper/fixtures
          python -m scraper run --counties volusia,polk --fixtures scraper/fixtures --skip-robots --out output/fixture-regression

      - name: Live county discovery
        id: discover
        continue-on-error: true
        run: python -m scraper -v discover

      - name: Live scrape
        id: scrape
        continue-on-error: true
        run: |
          # Pushes get a quick 1-county smoke test; manual/scheduled runs
          # default to the full county list.
          python -m scraper -v run --counties "${{ github.event_name == 'push' && 'volusia' || github.event.inputs.counties || '@config/client_counties.txt' }}"

      - name: Capture live pages (debug diagnostics)
        if: always()
        continue-on-error: true
        run: python -m scraper capture --out output/debug

      - name: Show results in log
        if: always()
        run: |
          echo "discover outcome: ${{ steps.discover.outcome }}"
          echo "scrape outcome:   ${{ steps.scrape.outcome }}"
          echo "=================== config/counties.json (first 60 lines)"
          head -60 config/counties.json || true
          latest=$(ls -td output/runs/*/ 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            echo "=================== $latest/run_meta.json"
            cat "$latest/run_meta.json" || true
            echo "=================== $latest/findings.json"
            cat "$latest/findings.json" || true
            for f in "$latest"*.csv; do
              echo "=================== $f (first 5 rows)"
              head -6 "$f" || true
            done
          else
            echo "No live run directory produced."
          fi

      - name: Commit run data to branch (manual + scheduled runs)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          latest=$(ls -td output/runs/*/ 2>/dev/null | head -1 || true)
          [ -z "$latest" ] && { echo "no run to commit"; exit 0; }
          name=$(basename "$latest")
          mkdir -p data/runs
          cp -r "$latest" "data/runs/$name"
          cp config/counties.json "data/runs/$name/counties.json" || true
          # Refresh the fixed-URL feeds consumed by the Google Sheet and the
          # dashboard (docs/DATA_FEED.md documents the contract). First export
          # builds the feed (geocoding new addresses), then the appraiser
          # quick-look enrichment runs against it, then a re-export merges the
          # enrichment in. Enrichment is best-effort — a broken county parser
          # never blocks the feed.
          python -m scraper export --run "data/runs/$name" || true
          # Quick-look scrub: appraiser record, the parcel's clerk case file, the
          # paperwork inside it, and (only when REPORTALL_API_KEY is configured)
          # the ReportAll parcel record.
          python -m scraper -v enrich --limit 300 --debug-dir output/debug/enrich || true
          python -m scraper export --run "data/runs/$name" || true
          # Retention: the feeds carry the merged history; keep only the last
          # 4 raw run directories so the repo doesn't grow forever.
          keep=4
          prune=$(ls -d data/runs/*/ 2>/dev/null | sort | head -n -$keep || true)
          [ -n "$prune" ] && git rm -rq $prune || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/runs data/exports
          git add -f data/geocache.json data/enrichment.json 2>/dev/null || true
          git commit -m "Data refresh: $name (${{ github.event.inputs.counties || 'weekly auto' }})" || exit 0
          # Anything pushed to the branch while the scrape was running (another
          # run, or a person) rejects this push. Rebase onto the new tip and try
          # again rather than losing an hour of scraping. On a conflict in the
          # generated feeds, -X theirs keeps THIS run's data: during a rebase
          # "theirs" is the commit being replayed, i.e. ours, and the fresher
          # scrape is the one worth keeping.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) — rebasing onto the latest tip"
            git fetch origin "${{ github.ref_name }}" || true
            git rebase -X theirs "origin/${{ github.ref_name }}" || git rebase --abort || true
            sleep $((attempt * 5))
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push run data after 5 attempts"
            exit 1
          fi
          # Token-authored pushes don't fire push-triggered workflows, so
          # explicitly redeploy the hosted dashboard with the fresh feeds.
          gh workflow run pages.yml --ref "${{ github.ref_name }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: add this repository secret to switch on ReportAll parcel
          # lookups (the LandGlide data). Unset = the step is skipped silently.
          REPORTALL_API_KEY: ${{ secrets.REPORTALL_API_KEY }}

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-run-outputs
          path: |
            output/runs/
            output/debug/
            data/enrichment.json
            config/counties.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if live steps failed
        if: steps.discover.outcome == 'failure' && steps.scrape.outcome == 'failure'
        run: exit 1
