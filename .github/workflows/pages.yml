name: Deploy site (GitHub Pages)

# Publishes the product site to GitHub Pages:
#   /       — the sales/landing page (site/)
#   /app/   — the dashboard app (dashboard/) + the data feeds
#   /data/exports/ — the feeds at a stable root path too (Sheet imports,
#                    integrations), same files as /app/data/exports/
# by pushing the assembled site to the gh-pages branch. Re-deploys whenever
# the site, dashboard or feeds change (the scrape workflow dispatches this
# one after committing new data, since pushes made with the workflow token
# don't trigger push events).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "dashboard/**"
      - "data/exports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/app/data/exports _site/data/exports
          cp -r site/. _site/
          cp -r dashboard/ds _site/ds
          cp -r dashboard/. _site/app/
          cp data/exports/* _site/app/data/exports/
          cp data/exports/* _site/data/exports/
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy dashboard from ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
      - name: Site URL
        run: echo "https://frankhatfellaaiagent-del.github.io/Taxdeed/"
