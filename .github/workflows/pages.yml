name: Deploy dashboard (GitHub Pages)

# Publishes dashboard/ + the data feeds to GitHub Pages:
#   https://frankhatfellaaiagent-del.github.io/Taxdeed/
# Re-deploys whenever the dashboard or the feeds change, so scraper runs
# refresh the hosted site automatically.

on:
  push:
    branches: [claude/florida-tax-deed-scraper-fqzwzd, main]
    paths:
      - "dashboard/**"
      - "data/exports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site/data/exports
          cp -r dashboard/. _site/
          cp data/exports/* _site/data/exports/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
