# Clerk of Court tax-deed pages per county — the clerk side of each sale
# (case files, deposits, surplus), as opposed to the RealAuction bidding site.
#
# Used by the exporter: each county's `url` is published in the feed
# (`clerk_sites`) and the dashboard links it from every property card.
# Counties missing from this file fall back to a targeted web search link.
#
# `verified` means the URL was corroborated against the clerk's own indexed
# pages (Aug 2026); re-check any that stop resolving — clerks move sites often
# (Polk moved to polkclerkfl.gov, Suwannee lives on suwgov.org, Volusia on
# clerk.org). `search` (optional) is a deeper case/file search portal.

